# SYNTHETIC BENCHMARK CONFIGURATION - PAYMENT SWITCH
[system]
system_id = SAMPLE-BANK-CARD-03
name = Synthetic Card Authorization and Settlement Switch
system_type = PAYMENT_GATEWAY
criticality = CRITICAL
trust_zone = APPLICATION
exposure = PARTNER
data_sensitivity = HIGHLY_SENSITIVE
data_lifetime = MEDIUM

[tls_transport]
tls_version = TLS 1.2
cipher_suite = ECDHE-RSA-AES256-GCM-SHA384
key_exchange = ECDHE
elliptic_curve = secp256r1
verify_peer = true
verify_hostname = true
client_cert_required = true
ca_file = /etc/security/certs/synthetic_card_ca.pem

[hardware_security_module]
hsm_enabled = true
hsm_vendor = Thales payShield 10K
pkcs11_library = /opt/nfast/toolkits/pkcs11/libcknfast.so
key_storage = HSM
slot_id = 1
slot_pin = REDACTED_SYNTHETIC_PIN_889900
key_wrapping_algorithm = RSA-2048
key_rotation_interval = 180_days

[card_crypto]
pin_block_format = ISO-0
pin_encryption_algorithm = 3DES
bulk_data_algorithm = AES-256-CBC
mac_algorithm = HMAC-SHA256
