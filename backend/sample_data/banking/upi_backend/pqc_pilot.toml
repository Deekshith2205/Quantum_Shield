# SYNTHETIC BENCHMARK CONFIGURATION - PQC HYBRID PILOT
[pqc_service]
service_name = "upi-pqc-hybrid-router"
enabled = true
crypto_agility_mode = "CONFIGURABLE"

[transport.tls]
min_version = "TLS 1.3"
max_version = "TLS 1.3"
ciphers = ["TLS_AES_256_GCM_SHA384", "TLS_CHACHA20_POLY1305_SHA256"]
key_exchange_groups = ["X25519MLKEM768", "X25519"]
fallback_to_classical = true

[crypto.primitives]
kem_algorithm = "ML-KEM-768"
signature_algorithm = "ML-DSA-65"
symmetric_cipher = "AES-256-GCM"
digest_algorithm = "SHA-384"
key_storage = "KMS"
kms_provider = "CloudKMS"
