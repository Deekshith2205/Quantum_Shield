# SYNTHETIC BENCHMARK CONFIGURATION - ATM HOST SWITCH
[system]
system_id = SAMPLE-BANK-ATM-06
name = Synthetic ATM Controller & Terminal Gateway
system_type = ATM_NETWORK
criticality = HIGH
trust_zone = DMZ
exposure = RESTRICTED
data_sensitivity = HIGHLY_SENSITIVE
data_lifetime = SHORT

[legacy_transport]
tls_version = TLS 1.1
allowed_protocols = TLSv1.0, TLSv1.1, TLSv1.2
cipher_suites = DES-CBC3-SHA, EDH-RSA-DES-CBC3-SHA, AES128-SHA
key_exchange = RSA
verify_peer = false
insecure_ssl = true

[hsm_terminal_keys]
hsm_type = HSM
hsm_model = Micro Focus Atalla Ax160
pin_block_cipher = 3DES
bulk_cipher = DES
mac_algorithm = SHA-1
key_wrapping_algorithm = RSA-1024
master_key_index = 0042
algorithm_agility = HARDCODED
key_storage = HSM
