system:
  system_id: BANK-PROF-KYC-DB
  system_type: CUSTOMER_DATABASE
  criticality: CRITICAL
  trust_zone: DATA
  exposure: RESTRICTED
  data_sensitivity: HIGHLY_SENSITIVE
  data_lifetime: VERY_LONG

transport:
  tls_version: TLSv1.3
  cipher_suite: TLS_AES_256_GCM_SHA384
  key_exchange: X25519
  certificate_algorithm: ECDSA-P384

database:
  encryption_algorithm: AES-256-GCM
  encryption_at_rest: enabled

key_management:
  key_wrapping_algorithm: RSA-2048
  key_storage_provider: AWS KMS
  kms_cmk: enabled
  automatic_rotation: true
  key_rotation_interval_days: 365
