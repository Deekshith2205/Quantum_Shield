# SYNTHETIC BENCHMARK CONFIGURATION - NGINX REVERSE PROXY
# System: Net Banking Web Tier

[ssl_server]
server_name = netbanking.synthetic-bank.local
ssl_protocols = TLSv1.2 TLSv1.3
ssl_ciphers = ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305
ssl_ecdh_curve = X25519:secp384r1
ssl_certificate = /etc/pki/tls/certs/synthetic_portal.crt
ssl_certificate_key = /etc/pki/tls/private/synthetic_portal.key
ssl_session_timeout = 1d
ssl_session_cache = shared:SSL:10m
ssl_stapling = on
ssl_stapling_verify = on
